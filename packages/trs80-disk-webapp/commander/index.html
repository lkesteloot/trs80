    <meta charset="utf-8">

    <title>Disk Commander</title>
    <link rel="stylesheet" href="/src/commander/commander.css">
</head>
<body>
<div class="title"><b>Disk Commander</b><span>my-trs-80.com/commander</span><span class="grow"></span>
    <button data-act="open" title="Open disk image files in the active panel (Ctrl-O)">[Open Disk]</button><button data-act="folder" title="Choose a folder on your computer (Alt-O)">[Open Folder]</button><button data-act="boot" title="Boot the floppy in the active panel in the TRS-80 emulator (Alt-B)">[Boot]</button>
    <a href="/disk/">[TRS-80 Disk]</a><button id="themeBtn" title="Switch between the light and dark themes">[Light]</button><button data-fk="1">[F1 Help]</button></div>
<div class="phonenote">
    <p>Disk Commander is a keyboard-driven, two-panel file manager, and it needs a wider window than this.</p>
    <p>On a phone, use the <a href="/disk/">TRS-80 Disk workbench</a>, which works with touch.</p>
</div>
<div class="panels" id="panels"></div>
<div class="msgs" id="msgs"></div>
<div class="cmdline"><span id="prompt">&gt; </span><input id="cmd" autocomplete="off" spellcheck="false" autofocus></div>
<div class="fkeys" id="fkeys"></div>
<div id="viewerLayer"></div>
<div id="layer"></div>

<script type="module" src="/src/commander/main.ts"></script>
</body>
