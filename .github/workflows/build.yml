name: Build and publish TRS-80 artifacts

on: [push]

env:
  REGISTRY: ghcr.io
  #IMAGE_NAME: ${{ github.repository }}
  IMAGE_NAME: lkesteloot/trs80-ide

jobs:
  build-all-packages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: npm clean-install
      - run: npm run build --workspaces
      - run: npm run test
      - uses: actions/upload-artifact@v6
        with:
          name: my-trs-80
          path: packages/my-trs-80/dist/
      - uses: actions/upload-artifact@v6
        with:
          name: trs80-cassette-webapp
          path: packages/trs80-cassette-webapp/dist/
      - uses: actions/upload-artifact@v6
        with:
          name: trs80-ide
          path: packages/trs80-ide/dist/
      - uses: actions/upload-artifact@v6
        with:
          name: trs80-tool-site
          path: packages/trs80-tool/site/
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: packages/trs80-ide
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-trs80-tool-binaries:
    # macOS, because the macOS binaries must be signed with codesign. Builds all platforms.
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm clean-install
      - run: npm run build --workspaces
      - run: npm run buildBinaries -w packages/trs80-tool
      - uses: actions/upload-artifact@v6
        with:
          name: trs80-tool-linux
          path: packages/trs80-tool/binaries/trs80-tool/linux/trs80-tool
      - uses: actions/upload-artifact@v6
        with:
          name: trs80-tool-macos
          path: packages/trs80-tool/binaries/trs80-tool/macos/trs80-tool
      - uses: actions/upload-artifact@v6
        with:
          name: trs80-tool-macos-arm64
          path: packages/trs80-tool/binaries/trs80-tool/macos-arm64/trs80-tool
      - uses: actions/upload-artifact@v6
        with:
          name: trs80-tool-windows
          path: packages/trs80-tool/binaries/trs80-tool/windows/trs80-tool.exe

  test-trs80-tool-binaries:
    # Run the Linux and Windows binaries on their own platforms, which the build
    # machine can't do. (The build script already runs the macOS arm64 one.)
    needs: build-trs80-tool-binaries
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: trs80-tool-linux
            binary: trs80-tool
          - os: windows-latest
            artifact: trs80-tool-windows
            binary: trs80-tool.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: ${{ matrix.artifact }}
      - shell: bash
        run: |
          chmod +x ${{ matrix.binary }}
          ./${{ matrix.binary }} --version
