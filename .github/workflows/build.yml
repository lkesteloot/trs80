name: Build and publish TRS-80 artifacts

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the run for the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-all-packages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm clean-install
      - run: npm run build
      - run: npm run test
      - uses: actions/upload-artifact@v6
        with:
          name: my-trs-80
          path: packages/my-trs-80/dist/
      - uses: actions/upload-artifact@v6
        with:
          name: trs80-cassette-webapp
          path: packages/trs80-cassette-webapp/dist/
      - uses: actions/upload-artifact@v6
        with:
          name: trs80-ide
          path: packages/trs80-ide/dist/
      - uses: actions/upload-artifact@v6
        with:
          name: trs80-tool-site
          path: packages/trs80-tool/site/

  build-trs80-tool-binaries:
    # macOS, because the macOS binaries must be signed with codesign. Builds all platforms.
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm clean-install
      - run: npm run buildBinaries -w packages/trs80-tool
      - uses: actions/upload-artifact@v6
        with:
          name: trs80-tool-linux
          path: packages/trs80-tool/binaries/trs80-tool/linux/trs80-tool
      - uses: actions/upload-artifact@v6
        with:
          name: trs80-tool-macos
          path: packages/trs80-tool/binaries/trs80-tool/macos/trs80-tool
      - uses: actions/upload-artifact@v6
        with:
          name: trs80-tool-macos-arm64
          path: packages/trs80-tool/binaries/trs80-tool/macos-arm64/trs80-tool
      - uses: actions/upload-artifact@v6
        with:
          name: trs80-tool-windows
          path: packages/trs80-tool/binaries/trs80-tool/windows/trs80-tool.exe

  test-trs80-tool-binaries:
    # Run the Linux and Windows binaries on their own platforms, which the build
    # machine can't do. (The build script already runs the macOS arm64 one.)
    needs: build-trs80-tool-binaries
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: trs80-tool-linux
            binary: trs80-tool
          - os: windows-latest
            artifact: trs80-tool-windows
            binary: trs80-tool.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: ${{ matrix.artifact }}
      - shell: bash
        run: |
          chmod +x ${{ matrix.binary }}
          ./${{ matrix.binary }} --version

  release-trs80-tool:
    # On master, publish the tool's binaries as a GitHub Release named for its
    # version (e.g., v4.6.0), once per version. The download links on the tool's
    # page point at the latest release. A version already tagged at another
    # commit isn't released again; bump the version to release.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [build-all-packages, test-trs80-tool-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: trs80-tool-*
          path: artifacts
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=v$(jq -r .version packages/trs80-tool/package.json)
          if gh release view "$tag" > /dev/null 2>&1; then
              echo "$tag is already released."
              exit 0
          fi
          tagged=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag" \
              --jq ".[] | select(.ref == \"refs/tags/$tag\") | .object.sha")
          if [ -n "$tagged" ] && [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "$tag is already tagged at $tagged. Bump the version to release."
              exit 0
          fi
          # Each platform's binary gets its own name, since a release's files must differ.
          mkdir release
          cp artifacts/trs80-tool-linux/trs80-tool release/trs80-tool-linux
          cp artifacts/trs80-tool-macos/trs80-tool release/trs80-tool-macos
          cp artifacts/trs80-tool-macos-arm64/trs80-tool release/trs80-tool-macos-arm64
          cp artifacts/trs80-tool-windows/trs80-tool.exe release/trs80-tool-windows.exe
          gh release create "$tag" release/* --target "$GITHUB_SHA" --title "trs80-tool $tag" \
              --notes "See the [change log](https://www.my-trs-80.com/tool/#change-log)."
